# HuiFlow 洗車機模擬板 — iot-washer-sim-base.yaml
# 目的：取代真實洗車機 + RPi WS server，快速壓力測試主板 v4.0.68 狀態機
# 對外接線（見 docs/spec.md）：
#   GPIO6 → 主板 GPIO21 (washer_led_blue, INPUT_PULLUP + inverted)
#   GPIO7 → 主板 GPIO47 (washer_led_green)
#   GPIO8 → 主板 GPIO35 (washer_led_red)
#   GPIO15 ← 主板 GPIO1  (UART2 TX, 9600 8N1)
#   GND 共地
# 對外網路：WiFi STA 固定 IP 192.168.1.10/24，gw 192.168.1.1
# WS server listens on 0.0.0.0:8090，無認證，主板連 /ws?device_id=xxx

substitutions:
  SIM_FIRMWARE_VER: "0.9.3"

esphome:
  name: iot-washer-sim
  friendly_name: iot-washer-sim
  on_boot:
    priority: 200
    then:
      - lambda: |-
          // 注冊 sim_ws_server callbacks：收到主板訊息時同步更新 sensor
          id(sws).set_on_message_callback([](const std::string &msg) {
            // 截斷長訊息以符合 text_sensor 上限
            std::string trimmed = msg.size() > 240 ? msg.substr(0, 240) + "..." : msg;
            id(last_rx_msg).publish_state(trimmed);
          });
          id(sws).set_on_connection_change_callback([](bool connected, const std::string &dev_id) {
            id(ws_client_connected).publish_state(connected ? "yes" : "no");
            id(ws_client_device_id).publish_state(dev_id);
            // Phase 7.1 兩階段 reconnect 測試：
            //   disconnect 觸發 → 若有 pending flag → expect reconnect
            //   reconnect 觸發 → observe（match pending expect）
            if (!connected) {
              if (id(a8_pending_disconnect)) {
                // min_actual_ms=500：避免 stale fast-reconnect 導致 false-PASS
                id(asrt).expect_event("A8", "ws_reconnect", "", -1, 500, 60000);
                id(a8_pending_disconnect) = false;
              }
              if (id(a9_pending_disconnect)) {
                // min_actual_ms=3000：reboot 至少要 3 秒
                id(asrt).expect_event("A9", "ws_reconnect", "", -1, 3000, 30000);
                id(a9_pending_disconnect) = false;
              }
            } else {
              id(asrt).observe_event("ws_reconnect", "", -1, -1);
            }
          });
          // Phase 2：主板每筆 EVENT/STATUS 解析後 → 推到對應 text_sensor
          // Phase 3：解析後同步餵 sim_assertion（observe_event）
          id(sws).set_on_parsed_event_callback([](const esphome::sim_ws_server::ParsedEvent &ev) {
            if (ev.type == "EVENT") {
              id(last_event_name).publish_state(ev.event_name);
            }
            if (!ev.wash_phase.empty()) {
              id(main_wash_phase).publish_state(ev.wash_phase);
            }
            if (ev.wash_stage >= 0 && ev.wash_total > 0) {
              char buf[16];
              snprintf(buf, sizeof(buf), "%d/%d", ev.wash_stage, ev.wash_total);
              id(main_wash_step).publish_state(std::string(buf));
            } else if (ev.wash_total == 0) {
              id(main_wash_step).publish_state(std::string("reset"));
            }
            // Phase 3：餵 assertion 引擎（只關心 EVENT 類型）
            if (ev.type == "EVENT") {
              id(asrt).observe_event(ev.event_name, ev.wash_phase, ev.wash_stage, ev.wash_total);
            }
          });
          // Phase 5：batch 每輪起始/結束的 hook
          //   起始：送 wash_init（主板才會 track wash_phase）+ startwasher5
          //   結束：送 wash_reset（清主板 wash state，下一輪乾淨）
          id(fsm).set_on_batch_round_callback([](uint32_t round_idx, bool starting) {
            if (starting) {
              // wash_init 6 步（對齊 sim_fsm SCENARIO_SW5 的 6 個 GREEN 相位）
              id(sws).send_text(
                "{\"type\":\"CMD\",\"cmd\":\"wash_init\","
                "\"total\":6,\"bb_timeout\":120,"
                "\"steps\":["
                  "{\"id\":\"501\",\"bb\":0,\"R03\":0,\"auto_sec\":0,\"name\":\"Standby\"},"
                  "{\"id\":\"502\",\"bb\":0,\"R03\":0,\"auto_sec\":1,\"name\":\"Pre-Wash\"},"
                  "{\"id\":\"503\",\"bb\":1,\"R03\":0,\"auto_sec\":1,\"name\":\"Foam\"},"
                  "{\"id\":\"504\",\"bb\":0,\"R03\":0,\"auto_sec\":1,\"name\":\"AIScanning\"},"
                  "{\"id\":\"505\",\"bb\":0,\"R03\":0,\"auto_sec\":1,\"name\":\"Final_Rinse\"},"
                  "{\"id\":\"506\",\"bb\":0,\"R03\":0,\"auto_sec\":0,\"name\":\"Complete\"}"
                "]}");
              // 100ms 後送 startwasher5（讓主板處理完 wash_init）
              // 直接連送、主板 message queue 會處理
              id(sws).send_text("{\"type\":\"CMD\",\"cmd\":\"startwasher5\"}");
            } else {
              // 結束：清主板 wash state
              id(sws).send_text("{\"type\":\"CMD\",\"cmd\":\"wash_reset\"}");
            }
          });

          // Phase 4：每筆 assertion 結果 → 推 CSV 行到 text_sensor
          //   格式：rule_id,P/F,actual_ms,window_ms,timestamp_ms,detail
          //   JS 端 SSE 收到後 split + 加入 rolling table
          id(asrt).set_on_result_callback([](const esphome::sim_assertion::AssertionResult &r) {
            char buf[280];
            snprintf(buf, sizeof(buf), "%s,%s,%u,%u,%u,%s",
                     r.assertion_id.c_str(),
                     r.pass ? "P" : "F",
                     r.actual_ms == UINT32_MAX ? 0 : (unsigned) r.actual_ms,
                     (unsigned) r.expected_within_ms,
                     (unsigned) r.timestamp_ms,
                     r.detail.c_str());
            std::string s(buf);
            if (s.size() > 240) s = s.substr(0, 240) + "...";
            id(assertion_result_csv).publish_state(s);
          });
          // 注冊 sim_fsm UART2 RX byte callback：累積 hex dump（最近 20 byte）
          id(fsm).set_rx_byte_log_callback([](uint8_t b) {
            static char buf[96];
            static int pos = 0;
            if (pos + 3 >= (int) sizeof(buf)) pos = 0;
            pos += snprintf(buf + pos, sizeof(buf) - pos, "%02X ", b);
            id(last_uart_rx).publish_state(std::string(buf));
          });
          // Phase 2：UART2 完整 frame 解完時推 last_washer_cmd
          id(fsm).set_on_washer_cmd_callback([](esphome::sim_fsm::WasherCmd cmd) {
            id(last_washer_cmd).publish_state(std::string(esphome::sim_fsm::washer_cmd_name(cmd)));
          });
          // Phase 7：UART2 burst 完成 → A7 assertion
          id(fsm).set_on_burst_complete_callback([](esphome::sim_fsm::WasherCmd cmd, uint8_t count,
                                                   uint32_t span_ms, bool intervals_ok) {
            // expect 立即 → observe 立即（同步邏輯，記入結果）
            id(asrt).expect_event("A7", "uart_burst", "", -1, 100);
            char buf[128];
            snprintf(buf, sizeof(buf), "uart_burst cmd=%s count=%u span=%ums intervals_ok=%d",
                     esphome::sim_fsm::washer_cmd_name(cmd), (unsigned) count,
                     (unsigned) span_ms, (int) intervals_ok);
            id(uart_burst_last).publish_state(std::string(buf));
            // 條件 pass：count==5 && intervals_ok
            if (count == 5 && intervals_ok) {
              id(asrt).observe_event("uart_burst", "", -1, -1);
            } else {
              // 故意不 observe，讓 100ms 後 timeout 計 fail
            }
          });
          // Phase 2：scenario 狀態變化推 fsm_last_event（Dashboard 顯示進度）
          // Phase 3：每次 led_change 同時對 sim_assertion 宣告期待
          id(fsm).set_on_fsm_state_callback([](const char *ev, const std::string &detail) {
            std::string s = std::string(ev) + ": " + detail;
            if (s.size() > 200) s = s.substr(0, 200) + "...";
            id(fsm_last_event).publish_state(s);

            // Phase 3 assertions：依 LED 顏色宣告期待
            if (strcmp(ev, "led_change") == 0) {
              if (detail == "green") {
                // A1: LED→GREEN → wash_stage with phase="green" within 500ms
                id(asrt).expect_event("A1", "wash_stage", "green", -1, 500);
              } else if (detail == "blue") {
                // A2: LED→BLUE → wash_stage with phase="blue" within 500ms
                id(asrt).expect_event("A2", "wash_stage", "blue", -1, 500);
              } else if (detail == "red") {
                // A3: LED→RED → wash_stage with wash_total=0 within 1000ms
                id(asrt).expect_event("A3", "wash_stage", "", 0, 1000);
              } else if (detail == "off") {
                // A4: LED→OFF → wash_nopower EVENT within 1500ms
                id(asrt).expect_event("A4", "wash_nopower", "", -1, 1500);
              }
            }
          });
          ESP_LOGI("INIT", "HuiFlow Washer Sim v${SIM_FIRMWARE_VER} booted");

# Phase 8：Self-Test 自動串接 A5→A6→A8→A9（2 分鐘跑完，不需硬體）
# Phase 9：ws_health_check（10 連發 CMD status，計算 reply 比率）
script:
  - id: run_ws_health
    mode: single
    then:
      - lambda: |-
          id(ws_health_status).publish_state("Phase 9: starting WS health (10 x CMD status)...");
          // 紀錄起始 RX frames 數，10 秒後比較
          id(_ws_health_rx_start) = id(sws).frames_rx();
          id(_ws_health_tx_start) = id(sws).frames_tx();
      - lambda: 'id(sws).send_text("{\"type\":\"CMD\",\"cmd\":\"status\"}");'
      - delay: 200ms
      - lambda: 'id(sws).send_text("{\"type\":\"CMD\",\"cmd\":\"status\"}");'
      - delay: 200ms
      - lambda: 'id(sws).send_text("{\"type\":\"CMD\",\"cmd\":\"status\"}");'
      - delay: 200ms
      - lambda: 'id(sws).send_text("{\"type\":\"CMD\",\"cmd\":\"status\"}");'
      - delay: 200ms
      - lambda: 'id(sws).send_text("{\"type\":\"CMD\",\"cmd\":\"status\"}");'
      - delay: 200ms
      - lambda: 'id(sws).send_text("{\"type\":\"CMD\",\"cmd\":\"status\"}");'
      - delay: 200ms
      - lambda: 'id(sws).send_text("{\"type\":\"CMD\",\"cmd\":\"status\"}");'
      - delay: 200ms
      - lambda: 'id(sws).send_text("{\"type\":\"CMD\",\"cmd\":\"status\"}");'
      - delay: 200ms
      - lambda: 'id(sws).send_text("{\"type\":\"CMD\",\"cmd\":\"status\"}");'
      - delay: 200ms
      - lambda: 'id(sws).send_text("{\"type\":\"CMD\",\"cmd\":\"status\"}");'
      - delay: 5s   # 等所有 reply 抵達
      - lambda: |-
          uint32_t tx_delta = id(sws).frames_tx() - id(_ws_health_tx_start);
          uint32_t rx_delta = id(sws).frames_rx() - id(_ws_health_rx_start);
          bool degraded = rx_delta < 5;  // 收到 < 5 reply 視為 degraded
          char buf[160];
          snprintf(buf, sizeof(buf),
                   "DONE: TX +%u | RX +%u | %s%s",
                   (unsigned) tx_delta, (unsigned) rx_delta,
                   degraded ? "DEGRADED — auto-recovery" : "HEALTHY",
                   degraded ? " (forcing reconnect)" : "");
          id(ws_health_status).publish_state(std::string(buf));
          // Phase 9.1：DEGRADED 自動觸發 disconnect → 主板會重連
          if (degraded) {
            id(sws).disconnect_client("ws health DEGRADED auto-recover");
          }

  # Phase 9.2：自動定期 health check（每 300s 跑一次，degraded 自動恢復）
  # （on_boot 60s 後啟動，避免撞 OTA check）
  - id: run_self_test
    mode: single
    then:
      - lambda: |-
          id(asrt).reset_stats();
          id(self_test_status).publish_state("RESET stats. Starting...");
      - delay: 1s

      # === A5：wash_init unlock_pwd → wash_phase=lock ===
      - lambda: |-
          id(self_test_status).publish_state("A5: sending wash_init+unlock_pwd...");
          id(asrt).expect_event("A5", "wash_stage", "lock", -1, 1500);
          id(sws).send_text(
            "{\"type\":\"CMD\",\"cmd\":\"wash_init\","
            "\"total\":2,\"bb_timeout\":30,"
            "\"unlock_pwd\":\"5678\","
            "\"steps\":["
              "{\"id\":\"501\",\"bb\":0,\"R03\":0,\"auto_sec\":0,\"name\":\"Standby\"},"
              "{\"id\":\"502\",\"bb\":0,\"R03\":0,\"auto_sec\":1,\"name\":\"Pre-Wash\"}"
            "]}");
      - delay: 3s

      # === A6：wash_unlock → EVENT wash_unlock ===
      - lambda: |-
          id(self_test_status).publish_state("A6: sending wash_unlock...");
          id(asrt).expect_event("A6", "wash_unlock", "", -1, 1500);
          id(sws).send_text("{\"type\":\"CMD\",\"cmd\":\"wash_unlock\"}");
      - delay: 3s

      # === A8：disconnect → reconnect within 60s ===
      - lambda: |-
          id(self_test_status).publish_state("A8: forcing disconnect...");
          id(a8_pending_disconnect) = true;
          id(sws).disconnect_client("self_test A8");
      - delay: 65s

      # === A9：reboot → reconnect within 30s ===
      - lambda: |-
          id(self_test_status).publish_state("A9: sending reboot...");
          id(a9_pending_disconnect) = true;
          id(sws).send_text("{\"type\":\"CMD\",\"cmd\":\"reboot\"}");
      - delay: 35s

      # === 報告 ===
      - lambda: |-
          char buf[160];
          snprintf(buf, sizeof(buf), "DONE: %u pass / %u fail | per-rule: %s",
                   (unsigned) id(asrt).total_pass(),
                   (unsigned) id(asrt).total_fail(),
                   id(asrt).per_rule_summary().c_str());
          id(self_test_status).publish_state(std::string(buf));
          ESP_LOGI("self_test", "%s", buf);

# Phase 7+ globals：A9 兩階段測試（等 disconnect 後再 expect reconnect）
# Phase 9+ globals：ws_health_check 起始 RX/TX 計數
globals:
  - id: a9_pending_disconnect
    type: bool
    initial_value: 'false'
  - id: a8_pending_disconnect
    type: bool
    initial_value: 'false'
  - id: _ws_health_rx_start
    type: uint32_t
    initial_value: '0'
  - id: _ws_health_tx_start
    type: uint32_t
    initial_value: '0'

esp32:
  board: esp32-s3-devkitc-1
  # 與主板一致用 esp-idf framework（main task stack 16KB 避免 PC=0 crash）
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "16384"

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

# 外部自訂元件
# ota_update 直接從主板 repo 複製（mbedtls 自包，無其他依賴）
external_components:
  - source: my_components
    components: [sim_fsm, sim_ws_server, ota_update, sim_assertion]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # 禁用 AP fallback（模擬板一定在實驗室內網，連不上就自己重啟）
  ap:
    ssid: "washer-sim-fallback"
    password: "12345678"
    ap_timeout: 15s
  manual_ip:
    static_ip: 192.168.1.10
    gateway: 192.168.1.1
    subnet: 255.255.255.0
    dns1: 192.168.1.1
    dns2: 8.8.8.8
  power_save_mode: none
  fast_connect: true

# 模擬板 Dashboard：沿用 ESPHome web_server v2 + 自訂 JS
web_server:
  port: 80
  version: 2
  js_include: "web/sim_dashboard.js"
  # 先不 include css，Phase 1 骨架只求能跑
  # css_include: "web/sim_dashboard.css"

ota:
  - platform: esphome
    password: ""

safe_mode:
  disabled: true

# === 自訂元件實體 ===
sim_fsm:
  id: fsm
  # 腳位完全對齊主板（杜邦線 sim N ↔ main N 直通）：
  #   sim GPIO 21 OUT → main GPIO 21 IN (washer_led_blue)
  #   sim GPIO 47 OUT → main GPIO 47 IN (washer_led_green)
  #   sim GPIO 35 OUT → main GPIO 35 IN (washer_led_red)
  #   sim GPIO  1 IN  ← main GPIO  1 OUT (UART2 TX 9600 8N1)
  # 注意：GPIO 35 必須不設 flash_size: 16MB（否則被 PSRAM 鎖）
  #       GPIO  1 是 U0RXD 但用 USB_SERIAL_JTAG logger 不衝突
  led_blue_pin: 21
  led_green_pin: 47
  led_red_pin: 35
  uart_rx_pin: 1

sim_ws_server:
  id: sws
  port: 8090

# Cloud OTA：manifest + firmware 放在 github public repo frankiehex/H_OTA_SIM
# 開機 8 秒後自動檢查一次（check_on_boot:true），失敗重試最多 5 次，每 30s 一次
# Dashboard 按鈕也可手動觸發（id(sim_ota).check_for_update()）
ota_update:
  id: sim_ota
  manifest_url: "https://raw.githubusercontent.com/frankiehex/H_OTA_SIM/main/manifest.json"
  current_version: "${SIM_FIRMWARE_VER}"
  check_on_boot: true

# Phase 3+4：assertion 引擎（A1~A5 規則 + pass/fail 統計 + result streaming）
sim_assertion:
  id: asrt

# === Text sensors：Dashboard 顯示狀態 ===
text_sensor:
  - platform: template
    name: "Firmware Version"
    id: firmware_ver
    lambda: |-
      return std::string("${SIM_FIRMWARE_VER}");
    update_interval: 60s

  - platform: template
    name: "Current LED"
    id: current_led
    lambda: |-
      return std::string(id(fsm).led_name());
    update_interval: 1s

  - platform: template
    name: "WS Client Connected"
    id: ws_client_connected
    # 由 on_connection_change callback 主動 publish_state（不用 lambda）
    update_interval: never

  - platform: template
    name: "WS Client Device ID"
    id: ws_client_device_id
    update_interval: never

  - platform: template
    name: "Last RX Message"
    id: last_rx_msg
    update_interval: never

  - platform: template
    name: "Last UART RX Bytes"
    id: last_uart_rx
    update_interval: never

  # Phase 2：UART2 frame parser 解出的最後一個指令（startwasher5 / gowasher 等）
  - platform: template
    name: "Last Washer CMD"
    id: last_washer_cmd
    update_interval: never

  # Phase 2：Scenario 狀態變化事件（scenario_start / scenario_step / scenario_finish / led_change）
  - platform: template
    name: "FSM Last Event"
    id: fsm_last_event
    update_interval: never

  - platform: template
    name: "Scenario Name"
    id: scenario_name
    lambda: 'return std::string(id(fsm).scenario_name());'
    update_interval: 1s

  - platform: template
    name: "Scenario Step"
    id: scenario_step
    lambda: |-
      if (id(fsm).scenario_total() == 0) return std::string("-");
      char buf[16];
      snprintf(buf, sizeof(buf), "%d/%d", id(fsm).scenario_step(), id(fsm).scenario_total());
      return std::string(buf);
    update_interval: 1s

  # Phase 2：主板回傳的 EVENT 解析結果（給 Dashboard 即時看主板狀態）
  - platform: template
    name: "Main Last Event"
    id: last_event_name
    update_interval: never

  - platform: template
    name: "Main Wash Phase"
    id: main_wash_phase
    update_interval: never

  - platform: template
    name: "Main Wash Step"
    id: main_wash_step
    update_interval: never

  # Phase 3：assertion 結果摘要（最近 1 筆 pass / fail）
  - platform: template
    name: "Assertion Last Pass"
    id: assertion_last_pass
    lambda: 'return id(asrt).last_pass_summary();'
    update_interval: 2s

  - platform: template
    name: "Assertion Last Fail"
    id: assertion_last_fail
    lambda: 'return id(asrt).last_fail_summary();'
    update_interval: 2s

  # Phase 4：每筆 result 即時 stream（SSE → JS rolling table）
  - platform: template
    name: "Assertion Result CSV"
    id: assertion_result_csv
    update_interval: never

  # Phase 6：per-rule 統計摘要（"A1:5/0@320ms|A2:3/2@420ms|..."）
  - platform: template
    name: "Assertion Per Rule"
    id: assertion_per_rule
    lambda: 'return id(asrt).per_rule_summary();'
    update_interval: 2s

  # Phase 7：UART2 burst 最近一筆描述
  - platform: template
    name: "UART Burst Last"
    id: uart_burst_last
    update_interval: never

  # Phase 8：Self-Test 進度顯示
  - platform: template
    name: "Self Test Status"
    id: self_test_status
    update_interval: never

  # Phase 9：WS health check 結果
  - platform: template
    name: "WS Health Status"
    id: ws_health_status
    update_interval: never

  # OTA 狀態（由 ota_update.cpp publish_sensor("OTA Status", ...) 主動推）
  - platform: template
    name: "OTA Status"
    id: ota_status
    update_interval: never

  - platform: template
    name: "OTA Remote Version"
    id: ota_remote_version
    lambda: 'return id(sim_ota).get_remote_version();'
    update_interval: 5s

  - platform: template
    name: "OTA Current Version"
    id: ota_current_version
    lambda: 'return std::string("${SIM_FIRMWARE_VER}");'
    update_interval: 60s

# === Sensors：統計數字 ===
sensor:
  - platform: uptime
    name: "Uptime"
    id: sim_uptime
    update_interval: 5s

  - platform: template
    name: "WS RX Frames"
    lambda: 'return (float) id(sws).frames_rx();'
    update_interval: 2s
    accuracy_decimals: 0

  - platform: template
    name: "WS TX Frames"
    lambda: 'return (float) id(sws).frames_tx();'
    update_interval: 2s
    accuracy_decimals: 0

  - platform: template
    name: "WS RX Bytes"
    lambda: 'return (float) id(sws).bytes_rx();'
    update_interval: 2s
    accuracy_decimals: 0

  - platform: template
    name: "WS TX Bytes"
    lambda: 'return (float) id(sws).bytes_tx();'
    update_interval: 2s
    accuracy_decimals: 0

  - platform: template
    name: "Free Heap"
    lambda: 'return (float) esp_get_free_heap_size();'
    update_interval: 5s
    accuracy_decimals: 0

  - platform: template
    name: "Scenarios Run"
    lambda: 'return (float) id(fsm).total_scenarios_run();'
    update_interval: 2s
    accuracy_decimals: 0

  - platform: template
    name: "UART CMDs Received"
    lambda: 'return (float) id(fsm).total_cmds_received();'
    update_interval: 2s
    accuracy_decimals: 0

  # Phase 3：assertion + batch + fault stats
  - platform: template
    name: "Assertion Pass"
    lambda: 'return (float) id(asrt).total_pass();'
    update_interval: 1s
    accuracy_decimals: 0

  - platform: template
    name: "Assertion Fail"
    lambda: 'return (float) id(asrt).total_fail();'
    update_interval: 1s
    accuracy_decimals: 0

  - platform: template
    name: "Assertion Pending"
    lambda: 'return (float) id(asrt).pending_count();'
    update_interval: 1s
    accuracy_decimals: 0

  - platform: template
    name: "Batch Remaining"
    lambda: 'return (float) id(fsm).batch_remaining();'
    update_interval: 1s
    accuracy_decimals: 0

  - platform: template
    name: "Batch Completed"
    lambda: 'return (float) id(fsm).batch_completed();'
    update_interval: 1s
    accuracy_decimals: 0

  - platform: template
    name: "Faults Injected"
    lambda: 'return (float) id(fsm).fault_count();'
    update_interval: 2s
    accuracy_decimals: 0

# === Buttons：Phase 1 手動切 LED + 發測試 CMD 給主板 ===
button:
  - platform: template
    name: "LED → OFF"
    id: btn_led_off
    on_press:
      - lambda: 'id(fsm).set_led(esphome::sim_fsm::SC_OFF);'

  - platform: template
    name: "LED → RED"
    id: btn_led_red
    on_press:
      - lambda: 'id(fsm).set_led(esphome::sim_fsm::SC_RED);'

  - platform: template
    name: "LED → GREEN"
    id: btn_led_green
    on_press:
      - lambda: 'id(fsm).set_led(esphome::sim_fsm::SC_GREEN);'

  - platform: template
    name: "LED → BLUE"
    id: btn_led_blue
    on_press:
      - lambda: 'id(fsm).set_led(esphome::sim_fsm::SC_BLUE);'

  - platform: template
    name: "Send CMD status"
    id: btn_send_cmd_status
    on_press:
      - lambda: 'id(sws).send_text("{\"type\":\"CMD\",\"cmd\":\"status\"}");'

  - platform: template
    name: "Send CMD reboot"
    id: btn_send_cmd_reboot
    on_press:
      - lambda: 'id(sws).send_text("{\"type\":\"CMD\",\"cmd\":\"reboot\"}");'

  - platform: template
    name: "Send CMD wash_reset"
    id: btn_send_cmd_wash_reset
    on_press:
      - lambda: 'id(sws).send_text("{\"type\":\"CMD\",\"cmd\":\"wash_reset\"}");'

  - platform: template
    name: "Send CMD startwasher5"
    id: btn_send_cmd_sw5
    on_press:
      - lambda: 'id(sws).send_text("{\"type\":\"CMD\",\"cmd\":\"startwasher5\"}");'

  - platform: template
    name: "Disconnect Client"
    id: btn_disconnect
    on_press:
      - lambda: 'id(sws).disconnect_client("dashboard request");'

  - platform: template
    name: "Check OTA Now"
    id: btn_check_ota
    on_press:
      - lambda: 'id(sim_ota).check_for_update();'

  # === Phase 2：scenario 引擎控制 ===
  - platform: template
    name: "Run SW5 @0.1x"
    id: btn_run_sw5_fast
    on_press:
      - lambda: |-
          // 先送 CMD 給主板，讓主板 wash_init 並派發 UART2 startwasher5
          id(sws).send_text("{\"type\":\"CMD\",\"cmd\":\"startwasher5\"}");
          // 再啟動本地 scenario（LED 壓縮到 0.1x 速度）
          id(fsm).start_scenario("SW5", 0.1f);

  - platform: template
    name: "Run SW5 @1.0x"
    id: btn_run_sw5_slow
    on_press:
      - lambda: |-
          id(sws).send_text("{\"type\":\"CMD\",\"cmd\":\"startwasher5\"}");
          id(fsm).start_scenario("SW5", 1.0f);

  - platform: template
    name: "Run SW6 @0.1x"
    id: btn_run_sw6_fast
    on_press:
      - lambda: |-
          id(sws).send_text("{\"type\":\"CMD\",\"cmd\":\"startwasher6\"}");
          id(fsm).start_scenario("SW6", 0.1f);

  - platform: template
    name: "Stop Scenario"
    id: btn_stop_scenario
    on_press:
      - lambda: |-
          id(fsm).stop_scenario();
          id(sws).send_text("{\"type\":\"CMD\",\"cmd\":\"wash_reset\"}");

  # === Phase 3：批次跑 + assertion 控制 ===
  - platform: template
    name: "Batch Run SW5 x10 @0.2x"
    id: btn_batch_sw5_10
    on_press:
      - lambda: |-
          id(asrt).reset_stats();
          id(fsm).start_batch("SW5", 0.2f, 10, 1500);

  - platform: template
    name: "Batch Run SW5 x100 @0.2x"
    id: btn_batch_sw5_100
    on_press:
      - lambda: |-
          id(asrt).reset_stats();
          id(fsm).start_batch("SW5", 0.2f, 100, 1500);

  - platform: template
    name: "Stop Batch"
    id: btn_stop_batch
    on_press:
      - lambda: 'id(fsm).stop_batch();'

  - platform: template
    name: "Reset Assertion Stats"
    id: btn_reset_assertion
    on_press:
      - lambda: 'id(asrt).reset_stats();'

  # === Phase 4：A5 wash_init.unlock_pwd 測試 ===
  # 送 wash_init 帶 unlock_pwd → 主板應送 EVENT wash_stage with phase="lock" within 500ms
  - platform: template
    name: "Test A5 (wash_init lock)"
    id: btn_test_a5
    on_press:
      - lambda: |-
          // 先期待 lock phase EVENT
          id(asrt).expect_event("A5", "wash_stage", "lock", -1, 1000);
          // 送 wash_init 帶 unlock_pwd（總共 2 步，泡泡 timeout 30s）
          id(sws).send_text(
            "{\"type\":\"CMD\",\"cmd\":\"wash_init\","
            "\"total\":2,\"bb_timeout\":30,"
            "\"unlock_pwd\":\"5678\","
            "\"steps\":["
              "{\"id\":\"501\",\"bb\":0,\"R03\":0,\"auto_sec\":0,\"name\":\"Standby\"},"
              "{\"id\":\"502\",\"bb\":0,\"R03\":0,\"auto_sec\":1,\"name\":\"Pre-Wash\"}"
            "]}");

  # 解鎖測試（送 wash_unlock CMD 應回 wash_unlock EVENT）
  - platform: template
    name: "Send wash_unlock"
    id: btn_send_wash_unlock
    on_press:
      - lambda: |-
          id(sws).send_text("{\"type\":\"CMD\",\"cmd\":\"wash_unlock\"}");

  # === Phase 5：A8 WS reconnect 測試 ===
  # 主動斷線 → 期待主板 60s 內重連（模擬幻象重連 race condition）
  # 兩階段：先設 flag → disconnect → 等 disconnect callback 觸發後才建立 expect
  - platform: template
    name: "Test A8 (disconnect+reconnect)"
    id: btn_test_a8
    on_press:
      - lambda: |-
          id(a8_pending_disconnect) = true;
          id(sws).disconnect_client("A8 test");

  # === Phase 6：A6 wash_unlock 測試 ===
  # 流程：先 wash_init 帶 unlock_pwd（讓主板進 lock 狀態）→ wash_unlock → EVENT
  # 修正：純 wash_unlock 在 not_locked 時不送 EVENT，所以 A6 必須先 lock
  - platform: template
    name: "Test A6 (lock then unlock)"
    id: btn_test_a6
    on_press:
      - lambda: |-
          // 步驟 1：先 lock（送 wash_init 帶 unlock_pwd）
          id(sws).send_text(
            "{\"type\":\"CMD\",\"cmd\":\"wash_init\","
            "\"total\":2,\"bb_timeout\":30,"
            "\"unlock_pwd\":\"5678\","
            "\"steps\":["
              "{\"id\":\"501\",\"bb\":0,\"R03\":0,\"auto_sec\":0,\"name\":\"Standby\"},"
              "{\"id\":\"502\",\"bb\":0,\"R03\":0,\"auto_sec\":1,\"name\":\"Pre-Wash\"}"
            "]}");
          // 步驟 2：等 200ms 後 expect + 送 unlock（YAML lambda 同步執行，
          //   依賴主板處理 wash_init 比 unlock 早。實測 lock 需 ~100ms）
          // 注意：ESPHome lambda 不支援 sleep，所以這個 expect 在 lock 之前就建立
          // 若 lock 失敗（主板沒進 lock 狀態），unlock 也不會發 EVENT，A6 會 timeout fail
          id(asrt).expect_event("A6", "wash_unlock", "", -1, 1500);
          // 直接連送 unlock，主板的 message queue 會依序處理 init → unlock
          id(sws).send_text("{\"type\":\"CMD\",\"cmd\":\"wash_unlock\"}");

  # === Phase 8：Self-Test 一鍵跑 A5/A6/A8/A9 (~2 分鐘) ===
  - platform: template
    name: "Run Self-Test (A5+A6+A8+A9)"
    id: btn_self_test
    on_press:
      - script.execute: run_self_test

  # === Phase 8.2：sim 板自身軟重啟（debug 卡住時用） ===
  - platform: restart
    name: "Sim Restart"
    id: btn_sim_restart

  # === Phase 9：WS Health Check（10 連發 status，看 reply 比率） ===
  - platform: template
    name: "Run WS Health Check"
    id: btn_ws_health
    on_press:
      - script.execute: run_ws_health

  # === Phase 6：A9 reboot 測試 ===
  # 送 reboot → 主板重啟 + reconnect within 30s
  # （主板重啟典型 8~15s + reconnect 5s）
  # 兩階段：先設 flag → 送 reboot → 等主板真的斷線後才建立 expect
  - platform: template
    name: "Test A9 (reboot+reconnect)"
    id: btn_test_a9
    on_press:
      - lambda: |-
          id(a9_pending_disconnect) = true;
          id(sws).send_text("{\"type\":\"CMD\",\"cmd\":\"reboot\"}");

# === Phase 3：故障注入機率 number sliders ===
# Phase 9.2：自動定期 health check（每 5 分鐘背景跑，degraded 自動恢復）
interval:
  - interval: 300s
    startup_delay: 60s
    then:
      - if:
          condition:
            lambda: 'return id(sws).is_client_connected();'
          then:
            - script.execute: run_ws_health

number:
  - platform: template
    name: "Fault Flicker Prob (%)"
    id: fault_flicker_pct
    optimistic: true
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 0
    set_action:
      - lambda: 'id(fsm).set_fault_flicker((uint8_t) x);'

  - platform: template
    name: "Fault Power Loss Prob (%)"
    id: fault_power_loss_pct
    optimistic: true
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 0
    set_action:
      - lambda: 'id(fsm).set_fault_power_loss((uint8_t) x);'

  - platform: template
    name: "Fault Red Burst Prob (%)"
    id: fault_red_burst_pct
    optimistic: true
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 0
    set_action:
      - lambda: 'id(fsm).set_fault_red_burst((uint8_t) x);'
