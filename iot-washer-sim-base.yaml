# HuiFlow 洗車機模擬板 — iot-washer-sim-base.yaml
# 目的：取代真實洗車機 + RPi WS server，快速壓力測試主板 v4.0.68 狀態機
# 對外接線（見 docs/spec.md）：
#   GPIO6 → 主板 GPIO21 (washer_led_blue, INPUT_PULLUP + inverted)
#   GPIO7 → 主板 GPIO47 (washer_led_green)
#   GPIO8 → 主板 GPIO35 (washer_led_red)
#   GPIO15 ← 主板 GPIO1  (UART2 TX, 9600 8N1)
#   GND 共地
# 對外網路：WiFi STA 固定 IP 192.168.1.10/24，gw 192.168.1.1
# WS server listens on 0.0.0.0:8090，無認證，主板連 /ws?device_id=xxx

substitutions:
  SIM_FIRMWARE_VER: "0.3.0"

esphome:
  name: iot-washer-sim
  friendly_name: iot-washer-sim
  on_boot:
    priority: 200
    then:
      - lambda: |-
          // 注冊 sim_ws_server callbacks：收到主板訊息時同步更新 sensor
          id(sws).set_on_message_callback([](const std::string &msg) {
            // 截斷長訊息以符合 text_sensor 上限
            std::string trimmed = msg.size() > 240 ? msg.substr(0, 240) + "..." : msg;
            id(last_rx_msg).publish_state(trimmed);
          });
          id(sws).set_on_connection_change_callback([](bool connected, const std::string &dev_id) {
            id(ws_client_connected).publish_state(connected ? "yes" : "no");
            id(ws_client_device_id).publish_state(dev_id);
          });
          // Phase 2：主板每筆 EVENT/STATUS 解析後 → 推到對應 text_sensor
          // Phase 3：解析後同步餵 sim_assertion（observe_event）
          id(sws).set_on_parsed_event_callback([](const esphome::sim_ws_server::ParsedEvent &ev) {
            if (ev.type == "EVENT") {
              id(last_event_name).publish_state(ev.event_name);
            }
            if (!ev.wash_phase.empty()) {
              id(main_wash_phase).publish_state(ev.wash_phase);
            }
            if (ev.wash_stage >= 0 && ev.wash_total > 0) {
              char buf[16];
              snprintf(buf, sizeof(buf), "%d/%d", ev.wash_stage, ev.wash_total);
              id(main_wash_step).publish_state(std::string(buf));
            } else if (ev.wash_total == 0) {
              id(main_wash_step).publish_state(std::string("reset"));
            }
            // Phase 3：餵 assertion 引擎（只關心 EVENT 類型）
            if (ev.type == "EVENT") {
              id(asrt).observe_event(ev.event_name, ev.wash_phase, ev.wash_stage, ev.wash_total);
            }
          });
          // 注冊 sim_fsm UART2 RX byte callback：累積 hex dump（最近 20 byte）
          id(fsm).set_rx_byte_log_callback([](uint8_t b) {
            static char buf[96];
            static int pos = 0;
            if (pos + 3 >= (int) sizeof(buf)) pos = 0;
            pos += snprintf(buf + pos, sizeof(buf) - pos, "%02X ", b);
            id(last_uart_rx).publish_state(std::string(buf));
          });
          // Phase 2：UART2 完整 frame 解完時推 last_washer_cmd
          id(fsm).set_on_washer_cmd_callback([](esphome::sim_fsm::WasherCmd cmd) {
            id(last_washer_cmd).publish_state(std::string(esphome::sim_fsm::washer_cmd_name(cmd)));
          });
          // Phase 2：scenario 狀態變化推 fsm_last_event（Dashboard 顯示進度）
          // Phase 3：每次 led_change 同時對 sim_assertion 宣告期待
          id(fsm).set_on_fsm_state_callback([](const char *ev, const std::string &detail) {
            std::string s = std::string(ev) + ": " + detail;
            if (s.size() > 200) s = s.substr(0, 200) + "...";
            id(fsm_last_event).publish_state(s);

            // Phase 3 assertions：依 LED 顏色宣告期待
            if (strcmp(ev, "led_change") == 0) {
              if (detail == "green") {
                // A1: LED→GREEN → wash_stage with phase="green" within 500ms
                id(asrt).expect_event("A1", "wash_stage", "green", -1, 500);
              } else if (detail == "blue") {
                // A2: LED→BLUE → wash_stage with phase="blue" within 500ms
                id(asrt).expect_event("A2", "wash_stage", "blue", -1, 500);
              } else if (detail == "red") {
                // A3: LED→RED → wash_stage with wash_total=0 within 1000ms
                id(asrt).expect_event("A3", "wash_stage", "", 0, 1000);
              } else if (detail == "off") {
                // A4: LED→OFF → wash_nopower EVENT within 1500ms
                id(asrt).expect_event("A4", "wash_nopower", "", -1, 1500);
              }
            }
          });
          ESP_LOGI("INIT", "HuiFlow Washer Sim v${SIM_FIRMWARE_VER} booted");

esp32:
  board: esp32-s3-devkitc-1
  # 與主板一致用 esp-idf framework（main task stack 16KB 避免 PC=0 crash）
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "16384"

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

# 外部自訂元件
# ota_update 直接從主板 repo 複製（mbedtls 自包，無其他依賴）
external_components:
  - source: my_components
    components: [sim_fsm, sim_ws_server, ota_update, sim_assertion]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # 禁用 AP fallback（模擬板一定在實驗室內網，連不上就自己重啟）
  ap:
    ssid: "washer-sim-fallback"
    password: "12345678"
    ap_timeout: 15s
  manual_ip:
    static_ip: 192.168.1.10
    gateway: 192.168.1.1
    subnet: 255.255.255.0
    dns1: 192.168.1.1
    dns2: 8.8.8.8
  power_save_mode: none
  fast_connect: true

# 模擬板 Dashboard：沿用 ESPHome web_server v2 + 自訂 JS
web_server:
  port: 80
  version: 2
  js_include: "web/sim_dashboard.js"
  # 先不 include css，Phase 1 骨架只求能跑
  # css_include: "web/sim_dashboard.css"

ota:
  - platform: esphome
    password: ""

safe_mode:
  disabled: true

# === 自訂元件實體 ===
sim_fsm:
  id: fsm
  # 腳位完全對齊主板（杜邦線 sim N ↔ main N 直通）：
  #   sim GPIO 21 OUT → main GPIO 21 IN (washer_led_blue)
  #   sim GPIO 47 OUT → main GPIO 47 IN (washer_led_green)
  #   sim GPIO 35 OUT → main GPIO 35 IN (washer_led_red)
  #   sim GPIO  1 IN  ← main GPIO  1 OUT (UART2 TX 9600 8N1)
  # 注意：GPIO 35 必須不設 flash_size: 16MB（否則被 PSRAM 鎖）
  #       GPIO  1 是 U0RXD 但用 USB_SERIAL_JTAG logger 不衝突
  led_blue_pin: 21
  led_green_pin: 47
  led_red_pin: 35
  uart_rx_pin: 1

sim_ws_server:
  id: sws
  port: 8090

# Cloud OTA：manifest + firmware 放在 github public repo frankiehex/H_OTA_SIM
# 開機 8 秒後自動檢查一次（check_on_boot:true），失敗重試最多 5 次，每 30s 一次
# Dashboard 按鈕也可手動觸發（id(sim_ota).check_for_update()）
ota_update:
  id: sim_ota
  manifest_url: "https://raw.githubusercontent.com/frankiehex/H_OTA_SIM/main/manifest.json"
  current_version: "${SIM_FIRMWARE_VER}"
  check_on_boot: true

# Phase 3：assertion 引擎（A1~A4 規則 + pass/fail 統計）
sim_assertion:
  id: asrt

# === Text sensors：Dashboard 顯示狀態 ===
text_sensor:
  - platform: template
    name: "Firmware Version"
    id: firmware_ver
    lambda: |-
      return std::string("${SIM_FIRMWARE_VER}");
    update_interval: 60s

  - platform: template
    name: "Current LED"
    id: current_led
    lambda: |-
      return std::string(id(fsm).led_name());
    update_interval: 1s

  - platform: template
    name: "WS Client Connected"
    id: ws_client_connected
    # 由 on_connection_change callback 主動 publish_state（不用 lambda）
    update_interval: never

  - platform: template
    name: "WS Client Device ID"
    id: ws_client_device_id
    update_interval: never

  - platform: template
    name: "Last RX Message"
    id: last_rx_msg
    update_interval: never

  - platform: template
    name: "Last UART RX Bytes"
    id: last_uart_rx
    update_interval: never

  # Phase 2：UART2 frame parser 解出的最後一個指令（startwasher5 / gowasher 等）
  - platform: template
    name: "Last Washer CMD"
    id: last_washer_cmd
    update_interval: never

  # Phase 2：Scenario 狀態變化事件（scenario_start / scenario_step / scenario_finish / led_change）
  - platform: template
    name: "FSM Last Event"
    id: fsm_last_event
    update_interval: never

  - platform: template
    name: "Scenario Name"
    id: scenario_name
    lambda: 'return std::string(id(fsm).scenario_name());'
    update_interval: 1s

  - platform: template
    name: "Scenario Step"
    id: scenario_step
    lambda: |-
      if (id(fsm).scenario_total() == 0) return std::string("-");
      char buf[16];
      snprintf(buf, sizeof(buf), "%d/%d", id(fsm).scenario_step(), id(fsm).scenario_total());
      return std::string(buf);
    update_interval: 1s

  # Phase 2：主板回傳的 EVENT 解析結果（給 Dashboard 即時看主板狀態）
  - platform: template
    name: "Main Last Event"
    id: last_event_name
    update_interval: never

  - platform: template
    name: "Main Wash Phase"
    id: main_wash_phase
    update_interval: never

  - platform: template
    name: "Main Wash Step"
    id: main_wash_step
    update_interval: never

  # Phase 3：assertion 結果摘要（最近 1 筆 pass / fail）
  - platform: template
    name: "Assertion Last Pass"
    id: assertion_last_pass
    lambda: 'return id(asrt).last_pass_summary();'
    update_interval: 2s

  - platform: template
    name: "Assertion Last Fail"
    id: assertion_last_fail
    lambda: 'return id(asrt).last_fail_summary();'
    update_interval: 2s

  # OTA 狀態（由 ota_update.cpp publish_sensor("OTA Status", ...) 主動推）
  - platform: template
    name: "OTA Status"
    id: ota_status
    update_interval: never

  - platform: template
    name: "OTA Remote Version"
    id: ota_remote_version
    lambda: 'return id(sim_ota).get_remote_version();'
    update_interval: 5s

  - platform: template
    name: "OTA Current Version"
    id: ota_current_version
    lambda: 'return std::string("${SIM_FIRMWARE_VER}");'
    update_interval: 60s

# === Sensors：統計數字 ===
sensor:
  - platform: uptime
    name: "Uptime"
    id: sim_uptime
    update_interval: 5s

  - platform: template
    name: "WS RX Frames"
    lambda: 'return (float) id(sws).frames_rx();'
    update_interval: 2s
    accuracy_decimals: 0

  - platform: template
    name: "WS TX Frames"
    lambda: 'return (float) id(sws).frames_tx();'
    update_interval: 2s
    accuracy_decimals: 0

  - platform: template
    name: "WS RX Bytes"
    lambda: 'return (float) id(sws).bytes_rx();'
    update_interval: 2s
    accuracy_decimals: 0

  - platform: template
    name: "WS TX Bytes"
    lambda: 'return (float) id(sws).bytes_tx();'
    update_interval: 2s
    accuracy_decimals: 0

  - platform: template
    name: "Free Heap"
    lambda: 'return (float) esp_get_free_heap_size();'
    update_interval: 5s
    accuracy_decimals: 0

  - platform: template
    name: "Scenarios Run"
    lambda: 'return (float) id(fsm).total_scenarios_run();'
    update_interval: 2s
    accuracy_decimals: 0

  - platform: template
    name: "UART CMDs Received"
    lambda: 'return (float) id(fsm).total_cmds_received();'
    update_interval: 2s
    accuracy_decimals: 0

  # Phase 3：assertion + batch + fault stats
  - platform: template
    name: "Assertion Pass"
    lambda: 'return (float) id(asrt).total_pass();'
    update_interval: 1s
    accuracy_decimals: 0

  - platform: template
    name: "Assertion Fail"
    lambda: 'return (float) id(asrt).total_fail();'
    update_interval: 1s
    accuracy_decimals: 0

  - platform: template
    name: "Assertion Pending"
    lambda: 'return (float) id(asrt).pending_count();'
    update_interval: 1s
    accuracy_decimals: 0

  - platform: template
    name: "Batch Remaining"
    lambda: 'return (float) id(fsm).batch_remaining();'
    update_interval: 1s
    accuracy_decimals: 0

  - platform: template
    name: "Batch Completed"
    lambda: 'return (float) id(fsm).batch_completed();'
    update_interval: 1s
    accuracy_decimals: 0

  - platform: template
    name: "Faults Injected"
    lambda: 'return (float) id(fsm).fault_count();'
    update_interval: 2s
    accuracy_decimals: 0

# === Buttons：Phase 1 手動切 LED + 發測試 CMD 給主板 ===
button:
  - platform: template
    name: "LED → OFF"
    id: btn_led_off
    on_press:
      - lambda: 'id(fsm).set_led(esphome::sim_fsm::SC_OFF);'

  - platform: template
    name: "LED → RED"
    id: btn_led_red
    on_press:
      - lambda: 'id(fsm).set_led(esphome::sim_fsm::SC_RED);'

  - platform: template
    name: "LED → GREEN"
    id: btn_led_green
    on_press:
      - lambda: 'id(fsm).set_led(esphome::sim_fsm::SC_GREEN);'

  - platform: template
    name: "LED → BLUE"
    id: btn_led_blue
    on_press:
      - lambda: 'id(fsm).set_led(esphome::sim_fsm::SC_BLUE);'

  - platform: template
    name: "Send CMD status"
    id: btn_send_cmd_status
    on_press:
      - lambda: 'id(sws).send_text("{\"type\":\"CMD\",\"cmd\":\"status\"}");'

  - platform: template
    name: "Send CMD reboot"
    id: btn_send_cmd_reboot
    on_press:
      - lambda: 'id(sws).send_text("{\"type\":\"CMD\",\"cmd\":\"reboot\"}");'

  - platform: template
    name: "Send CMD wash_reset"
    id: btn_send_cmd_wash_reset
    on_press:
      - lambda: 'id(sws).send_text("{\"type\":\"CMD\",\"cmd\":\"wash_reset\"}");'

  - platform: template
    name: "Send CMD startwasher5"
    id: btn_send_cmd_sw5
    on_press:
      - lambda: 'id(sws).send_text("{\"type\":\"CMD\",\"cmd\":\"startwasher5\"}");'

  - platform: template
    name: "Disconnect Client"
    id: btn_disconnect
    on_press:
      - lambda: 'id(sws).disconnect_client("dashboard request");'

  - platform: template
    name: "Check OTA Now"
    id: btn_check_ota
    on_press:
      - lambda: 'id(sim_ota).check_for_update();'

  # === Phase 2：scenario 引擎控制 ===
  - platform: template
    name: "Run SW5 @0.1x"
    id: btn_run_sw5_fast
    on_press:
      - lambda: |-
          // 先送 CMD 給主板，讓主板 wash_init 並派發 UART2 startwasher5
          id(sws).send_text("{\"type\":\"CMD\",\"cmd\":\"startwasher5\"}");
          // 再啟動本地 scenario（LED 壓縮到 0.1x 速度）
          id(fsm).start_scenario("SW5", 0.1f);

  - platform: template
    name: "Run SW5 @1.0x"
    id: btn_run_sw5_slow
    on_press:
      - lambda: |-
          id(sws).send_text("{\"type\":\"CMD\",\"cmd\":\"startwasher5\"}");
          id(fsm).start_scenario("SW5", 1.0f);

  - platform: template
    name: "Run SW6 @0.1x"
    id: btn_run_sw6_fast
    on_press:
      - lambda: |-
          id(sws).send_text("{\"type\":\"CMD\",\"cmd\":\"startwasher6\"}");
          id(fsm).start_scenario("SW6", 0.1f);

  - platform: template
    name: "Stop Scenario"
    id: btn_stop_scenario
    on_press:
      - lambda: |-
          id(fsm).stop_scenario();
          id(sws).send_text("{\"type\":\"CMD\",\"cmd\":\"wash_reset\"}");

  # === Phase 3：批次跑 + assertion 控制 ===
  - platform: template
    name: "Batch Run SW5 x10 @0.2x"
    id: btn_batch_sw5_10
    on_press:
      - lambda: |-
          id(asrt).reset_stats();
          id(fsm).start_batch("SW5", 0.2f, 10, 1500);

  - platform: template
    name: "Batch Run SW5 x100 @0.2x"
    id: btn_batch_sw5_100
    on_press:
      - lambda: |-
          id(asrt).reset_stats();
          id(fsm).start_batch("SW5", 0.2f, 100, 1500);

  - platform: template
    name: "Stop Batch"
    id: btn_stop_batch
    on_press:
      - lambda: 'id(fsm).stop_batch();'

  - platform: template
    name: "Reset Assertion Stats"
    id: btn_reset_assertion
    on_press:
      - lambda: 'id(asrt).reset_stats();'

# === Phase 3：故障注入機率 number sliders ===
number:
  - platform: template
    name: "Fault Flicker Prob (%)"
    id: fault_flicker_pct
    optimistic: true
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 0
    set_action:
      - lambda: 'id(fsm).set_fault_flicker((uint8_t) x);'

  - platform: template
    name: "Fault Power Loss Prob (%)"
    id: fault_power_loss_pct
    optimistic: true
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 0
    set_action:
      - lambda: 'id(fsm).set_fault_power_loss((uint8_t) x);'

  - platform: template
    name: "Fault Red Burst Prob (%)"
    id: fault_red_burst_pct
    optimistic: true
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 0
    set_action:
      - lambda: 'id(fsm).set_fault_red_burst((uint8_t) x);'
