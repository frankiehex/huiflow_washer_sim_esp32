# HuiFlow 洗車機模擬板 — secrets template
# 複製到 secrets.yaml（已被 .gitignore），填入真實值
#
#   cp secrets.example.yaml secrets.yaml
#   vi secrets.yaml    # 改 wifi_ssid / wifi_password

wifi_ssid: "YOUR_WIFI_SSID"
wifi_password: "YOUR_WIFI_PASSWORD"

# 模擬板自己的 device_id（不能和主板 "iot-washer" 衝突）
sim_device_id: "washer_sim_001"

# 模擬板固定 IP（和主板 secrets.yaml 裡的 ws_lan_server 必須一致）
sim_static_ip: "192.168.1.10"
sim_gateway: "192.168.1.1"
sim_subnet: "255.255.255.0"
sim_dns1: "192.168.1.1"
sim_dns2: "8.8.8.8"

# 模擬板 WS server port（主板會連這裡）
sim_ws_port: "8090"
